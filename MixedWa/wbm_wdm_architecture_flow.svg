<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">WBM-WDM matching workflow with CAM</title>
  <desc id="desc">A simplified workflow diagram for supervised training, optional domain adaptation, CAM weak localization, and WBM-WDM matching.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333" />
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #222; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #444; }
      .box { fill: #ffffff; stroke: #333; stroke-width: 1.4; rx: 8; }
      .blue { fill: #eaf2ff; stroke: #3b638f; stroke-width: 1.4; rx: 8; }
      .green { fill: #edf7ee; stroke: #4c7a54; stroke-width: 1.4; rx: 8; }
      .orange { fill: #fff3e4; stroke: #a7692b; stroke-width: 1.4; rx: 8; }
      .gray { fill: #f1f1f1; stroke: #333; stroke-width: 1.4; rx: 8; }
      .group { fill: none; stroke: #555; stroke-width: 1.4; stroke-dasharray: 7 5; rx: 12; }
      .arrow { stroke: #333; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #666; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .formula { font-family: 'Times New Roman', Times, serif; font-size: 17px; font-style: italic; fill: #111; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="660" fill="#ffffff" />
  <text class="title" x="550" y="38" text-anchor="middle">Workflow of the WBM-WDM Matching Framework</text>
  <text class="small" x="550" y="61" text-anchor="middle">Supervised encoder training, optional domain adaptation, and CAM-based matching inference</text>

  <!-- Stage 1 -->
  <rect class="box" x="45" y="105" width="150" height="78" />
  <text class="label" x="120" y="134" text-anchor="middle">WM38K WBM</text>
  <text class="text" x="120" y="159" text-anchor="middle">wafer maps</text>
  <text class="small" x="120" y="177" text-anchor="middle">multi-label classes</text>

  <rect class="blue" x="280" y="98" width="190" height="92" />
  <text class="label" x="375" y="130" text-anchor="middle">Supervised Training</text>
  <text class="text" x="375" y="156" text-anchor="middle">encoder + classifier</text>
  <text class="formula" x="375" y="177" text-anchor="middle">BCE loss</text>

  <rect class="gray" x="560" y="105" width="165" height="78" />
  <text class="label" x="642.5" y="135" text-anchor="middle">Trained Model</text>
  <text class="text" x="642.5" y="160" text-anchor="middle">encoder</text>
  <text class="small" x="642.5" y="178" text-anchor="middle">classification head</text>

  <path class="arrow" d="M195 144 L280 144" />
  <path class="arrow" d="M470 144 L560 144" />

  <!-- Stage 2 optional -->
  <rect class="group" x="65" y="250" width="640" height="130" />
  <text class="label" x="385" y="278" text-anchor="middle">Optional Domain Adaptation</text>

  <rect class="box" x="85" y="300" width="150" height="56" />
  <text class="label" x="160" y="323" text-anchor="middle">WDM Data</text>
  <text class="small" x="160" y="343" text-anchor="middle">real or synthetic</text>

  <rect class="green" x="305" y="300" width="160" height="56" />
  <text class="label" x="385" y="323" text-anchor="middle">Pseudo-WBM</text>
  <text class="small" x="385" y="343" text-anchor="middle">spatial averaging</text>

  <rect class="green" x="535" y="300" width="150" height="56" />
  <text class="label" x="610" y="323" text-anchor="middle">Adapt Encoder</text>
  <text class="formula" x="610" y="344" text-anchor="middle">WaPIRL / NCE</text>

  <path class="arrow" d="M235 328 L305 328" />
  <path class="arrow" d="M465 328 L535 328" />
  <path class="dash" d="M642 183 C650 230 648 270 622 300" />
  <text class="small" x="704" y="246" text-anchor="middle">optional fine-tuning</text>
  <path class="dash" d="M610 356 C610 432 520 485 450 535" />
  <text class="small" x="620" y="426" text-anchor="middle">adapted encoder</text>

  <!-- Stage 3 -->
  <rect class="box" x="45" y="465" width="150" height="78" />
  <text class="label" x="120" y="494" text-anchor="middle">WBM Query</text>
  <text class="text" x="120" y="519" text-anchor="middle">target wafer map</text>

  <rect class="box" x="45" y="555" width="150" height="78" />
  <text class="label" x="120" y="584" text-anchor="middle">WDM Gallery</text>
  <text class="text" x="120" y="609" text-anchor="middle">candidate maps</text>

  <rect class="blue" x="280" y="510" width="170" height="78" />
  <text class="label" x="365" y="539" text-anchor="middle">Encoder Forward</text>
  <text class="text" x="365" y="564" text-anchor="middle">features + logits</text>

  <rect class="orange" x="525" y="510" width="170" height="78" />
  <text class="label" x="610" y="539" text-anchor="middle">CAM Localization</text>
  <text class="text" x="610" y="564" text-anchor="middle">class heatmaps</text>

  <rect class="orange" x="770" y="510" width="170" height="78" />
  <text class="label" x="855" y="539" text-anchor="middle">Matching Score</text>
  <text class="small" x="855" y="561" text-anchor="middle">label, shape, size,</text>
  <text class="small" x="855" y="578" text-anchor="middle">position, local feature</text>

  <rect class="gray" x="975" y="510" width="95" height="78" />
  <text class="label" x="1022.5" y="541" text-anchor="middle">Top-k</text>
  <text class="text" x="1022.5" y="565" text-anchor="middle">matches</text>

  <path class="arrow" d="M195 504 C230 504 238 535 280 535" />
  <path class="arrow" d="M195 594 C230 594 238 563 280 563" />
  <path class="arrow" d="M450 549 L525 549" />
  <path class="arrow" d="M695 549 L770 549" />
  <path class="arrow" d="M940 549 L975 549" />
  <path class="dash" d="M642 183 C575 280 498 420 450 535" />
  <text class="small" x="517" y="403" text-anchor="middle">skip adaptation</text>

  <!-- Formula and note -->
  <text class="formula" x="855" y="624" text-anchor="middle">score = α label overlap + β shape + γ size + δ position + ε local feature</text>
  <text class="small" x="550" y="646" text-anchor="middle">Dashed paths indicate optional adaptation; inference can use either the trained or adapted encoder.</text>
</svg>
