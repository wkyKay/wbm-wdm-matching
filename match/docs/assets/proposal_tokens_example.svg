<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Proposal token extraction example</title>
  <desc id="desc">A mapped 9 by 7 defect map is grouped into proposal tokens through 8-connected components and compact post-processing.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d8dee8;stroke-width:1.2}.title{font:700 22px Inter,Arial,sans-serif;fill:#1f2933}.label{font:700 15px Inter,Arial,sans-serif;fill:#1f2933}.small{font:500 12px Inter,Arial,sans-serif;fill:#617083}.cell{fill:#fff;stroke:#d8dee8;stroke-width:1}.empty{fill:#eef2f7}.a{fill:#16697a}.b{fill:#2f7d32}.c{fill:#9a5b13}.ghost{fill:#dce7ea;stroke:#16697a;stroke-width:2;stroke-dasharray:5 4}.arrow{stroke:#16697a;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16697a"/></marker>
  </defs>
  <rect class="bg" width="1080" height="430"/>
  <rect class="panel" x="28" y="28" width="1024" height="374" rx="10"/>
  <text class="title" x="54" y="70">Step 2 · Proposal: 8 连通区域到 token</text>
  <text class="label" x="92" y="112">Input mask</text>
  <text class="label" x="458" y="112">Connected components</text>
  <text class="label" x="797" y="112">Token stats</text>
  <path class="arrow" d="M330 216H410"/>
  <path class="arrow" d="M670 216H750"/>
  <g transform="translate(92 138)">
    <rect x="-12" y="-12" width="238" height="206" rx="8" fill="#f1f5f9" stroke="#d8dee8"/>
    <g>
      <rect class="cell empty" x="0" y="0" width="22" height="22" rx="4"/><rect class="cell empty" x="26" y="0" width="22" height="22" rx="4"/><rect class="cell empty" x="52" y="0" width="22" height="22" rx="4"/><rect class="cell empty" x="78" y="0" width="22" height="22" rx="4"/><rect class="cell empty" x="104" y="0" width="22" height="22" rx="4"/><rect class="cell empty" x="130" y="0" width="22" height="22" rx="4"/><rect class="cell empty" x="156" y="0" width="22" height="22" rx="4"/><rect class="cell empty" x="182" y="0" width="22" height="22" rx="4"/>
      <rect class="cell empty" x="0" y="26" width="22" height="22" rx="4"/><rect class="cell a" x="26" y="26" width="22" height="22" rx="4"/><rect class="cell a" x="52" y="26" width="22" height="22" rx="4"/><rect class="cell empty" x="78" y="26" width="22" height="22" rx="4"/><rect class="cell empty" x="104" y="26" width="22" height="22" rx="4"/><rect class="cell c" x="130" y="26" width="22" height="22" rx="4"/><rect class="cell empty" x="156" y="26" width="22" height="22" rx="4"/><rect class="cell empty" x="182" y="26" width="22" height="22" rx="4"/>
      <rect class="cell empty" x="0" y="52" width="22" height="22" rx="4"/><rect class="cell a" x="26" y="52" width="22" height="22" rx="4"/><rect class="cell a" x="52" y="52" width="22" height="22" rx="4"/><rect class="cell empty" x="78" y="52" width="22" height="22" rx="4"/><rect class="cell b" x="104" y="52" width="22" height="22" rx="4"/><rect class="cell c" x="130" y="52" width="22" height="22" rx="4"/><rect class="cell c" x="156" y="52" width="22" height="22" rx="4"/><rect class="cell empty" x="182" y="52" width="22" height="22" rx="4"/>
      <rect class="cell empty" x="0" y="78" width="22" height="22" rx="4"/><rect class="cell empty" x="26" y="78" width="22" height="22" rx="4"/><rect class="cell empty" x="52" y="78" width="22" height="22" rx="4"/><rect class="cell b" x="78" y="78" width="22" height="22" rx="4"/><rect class="cell b" x="104" y="78" width="22" height="22" rx="4"/><rect class="cell empty" x="130" y="78" width="22" height="22" rx="4"/><rect class="cell c" x="156" y="78" width="22" height="22" rx="4"/><rect class="cell empty" x="182" y="78" width="22" height="22" rx="4"/>
      <rect class="cell empty" x="0" y="104" width="22" height="22" rx="4"/><rect class="cell empty" x="26" y="104" width="22" height="22" rx="4"/><rect class="cell empty" x="52" y="104" width="22" height="22" rx="4"/><rect class="cell empty" x="78" y="104" width="22" height="22" rx="4"/><rect class="cell b" x="104" y="104" width="22" height="22" rx="4"/><rect class="cell empty" x="130" y="104" width="22" height="22" rx="4"/><rect class="cell empty" x="156" y="104" width="22" height="22" rx="4"/><rect class="cell empty" x="182" y="104" width="22" height="22" rx="4"/>
      <g opacity=".7"><rect class="cell empty" x="0" y="130" width="22" height="22" rx="4"/><rect class="cell empty" x="26" y="130" width="22" height="22" rx="4"/><rect class="cell empty" x="52" y="130" width="22" height="22" rx="4"/><rect class="cell empty" x="78" y="130" width="22" height="22" rx="4"/><rect class="cell empty" x="104" y="130" width="22" height="22" rx="4"/><rect class="cell empty" x="130" y="130" width="22" height="22" rx="4"/><rect class="cell empty" x="156" y="130" width="22" height="22" rx="4"/><rect class="cell empty" x="182" y="130" width="22" height="22" rx="4"/></g>
    </g>
  </g>
  <g transform="translate(452 138)">
    <rect x="-12" y="-12" width="238" height="206" rx="8" fill="#f1f5f9" stroke="#d8dee8"/>
    <rect class="ghost" x="20" y="20" width="62" height="62" rx="8"/>
    <rect class="ghost" x="72" y="46" width="62" height="88" rx="8"/>
    <rect class="ghost" x="124" y="20" width="62" height="88" rx="8"/>
    <text class="label" x="38" y="58" fill="#16697a">T1</text>
    <text class="label" x="91" y="96" fill="#2f7d32">T2</text>
    <text class="label" x="143" y="58" fill="#9a5b13">T3</text>
    <text class="small" x="4" y="170">8-connected components + compact merge</text>
  </g>
  <g transform="translate(790 139)">
    <rect x="0" y="0" width="230" height="190" rx="8" fill="#fbfcfd" stroke="#d8dee8"/>
    <text class="label" x="18" y="34">Token feature record</text>
    <text class="small" x="18" y="66">area = number of cells</text>
    <text class="small" x="18" y="90">centroid = weighted mean</text>
    <text class="small" x="18" y="114">bbox = min/max row/col</text>
    <text class="small" x="18" y="138">pca = elongation + direction</text>
    <text class="small" x="18" y="162">radial / angular profile</text>
  </g>
</svg>
