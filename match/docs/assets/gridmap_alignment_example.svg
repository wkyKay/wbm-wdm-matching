<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">GridMap alignment example</title>
  <desc id="desc">A 9 by 7 WBM fail map and a mapped WDM count map aligned to the same grid size.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d8dee8;stroke-width:1.2}.title{font:700 22px Inter,Arial,sans-serif;fill:#1f2933}.label{font:600 14px Inter,Arial,sans-serif;fill:#617083}.small{font:500 12px Inter,Arial,sans-serif;fill:#617083}.cell{stroke:#d8dee8;stroke-width:1}.outer{fill:#111827}.inside{fill:#6b7280}.fail{fill:#f8fafc}.defect{fill:#d3422f}.weak{fill:#e58c2d}.arrow{stroke:#16697a;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
