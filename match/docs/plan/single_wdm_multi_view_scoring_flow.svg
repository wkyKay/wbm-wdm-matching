<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="desc">
  <desc id="desc">A workflow diagram for product-aware WDM-to-WBM mapping, multi-view score decomposition, score fusion, and top-k single-WDM retrieval.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#303030" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666" />
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #444; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #222; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #444; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #555; }
      .formula { font-family: 'Times New Roman', Times, serif; font-size: 17px; font-style: italic; fill: #111; }
      .box { fill: #ffffff; stroke: #333; stroke-width: 1.4; rx: 8; }
      .input { fill: #f7f7f7; stroke: #333; stroke-width: 1.4; rx: 8; }
      .map { fill: #eaf2ff; stroke: #3b638f; stroke-width: 1.4; rx: 8; }
      .score { fill: #fff2df; stroke: #b06d27; stroke-width: 1.4; rx: 8; }
      .fusion { fill: #edf7ee; stroke: #4c7a54; stroke-width: 1.4; rx: 8; }
      .result { fill: #efeff8; stroke: #5a5a8f; stroke-width: 1.4; rx: 8; }
      .group { fill: none; stroke: #777; stroke-width: 1.2; stroke-dasharray: 7 5; rx: 12; }
      .arrow { stroke: #303030; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-muted { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrowMuted); }
      .dash { stroke: #777; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrowMuted); }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="760" fill="#ffffff" />
  <!-- Inputs -->
  <rect class="input" x="45" y="185" width="170" height="88" />
  <text class="label" x="130" y="213" text-anchor="middle">WBM (R)</text>
  <text class="text" x="130" y="238" text-anchor="middle">R</text>
  <text class="small" x="130" y="258" text-anchor="middle">product grid H x W</text>

  <rect class="input" x="45" y="335" width="170" height="88" />
  <text class="label" x="130" y="363" text-anchor="middle">WDMs (C)</text>
  <text class="text" x="130" y="388" text-anchor="middle">C1, C2, ..., CN</text>
  <text class="small" x="130" y="408" text-anchor="middle">scatter defect maps</text>

  <!-- Mapping -->
  <rect class="map" x="295" y="245" width="225" height="120" />
  <text class="label" x="407.5" y="277" text-anchor="middle">Product-aware</text>
  <text class="label" x="407.5" y="299" text-anchor="middle">Grid Mapping</text>
  <text class="text" x="407.5" y="329" text-anchor="middle">T_p(C_i)</text>
  <text class="small" x="407.5" y="350" text-anchor="middle">C scatter -> R grid</text>

  <path class="arrow" d="M215 229 C255 229 250 270 295 286" />
  <path class="arrow" d="M215 379 C255 379 250 340 295 324" />

  <!-- Map representations -->
  <rect class="group" x="585" y="185" width="215" height="240" />
  <text class="label" x="692.5" y="214" text-anchor="middle">Aligned Grid</text>
  <text class="label" x="692.5" y="237" text-anchor="middle">Representation</text>

  <rect class="map" x="618" y="270" width="150" height="72" />
  <text class="text" x="693" y="298" text-anchor="middle">mapped C</text>
  <text class="text" x="693" y="320" text-anchor="middle">on R grid</text>

  <text class="small" x="692.5" y="382" text-anchor="middle">comparable spatial representation</text>
  <text class="small" x="692.5" y="402" text-anchor="middle">for multi-view scoring</text>

  <path class="arrow" d="M520 305 L618 306" />

  <!-- Score modules -->
  <rect class="group" x="820" y="92" width="225" height="506" />
  <text class="label" x="932.5" y="120" text-anchor="middle">Multi-view Evidence</text>

  <rect class="score" x="845" y="143" width="175" height="52" />
  <text class="label" x="932.5" y="164" text-anchor="middle">Coverage</text>
  <text class="small" x="932.5" y="184" text-anchor="middle">explains R defects</text>

  <rect class="score" x="845" y="216" width="175" height="52" />
  <text class="label" x="932.5" y="237" text-anchor="middle">Leakage</text>
  <text class="small" x="932.5" y="257" text-anchor="middle">penalizes extra defects</text>

  <rect class="score" x="845" y="289" width="175" height="52" />
  <text class="label" x="932.5" y="310" text-anchor="middle">Shape</text>
  <text class="small" x="932.5" y="330" text-anchor="middle">structure similarity</text>

  <rect class="score" x="845" y="362" width="175" height="52" />
  <text class="label" x="932.5" y="383" text-anchor="middle">Location</text>
  <text class="small" x="932.5" y="403" text-anchor="middle">centroid / position</text>

  <rect class="score" x="845" y="435" width="175" height="52" />
  <text class="label" x="932.5" y="456" text-anchor="middle">Size</text>
  <text class="small" x="932.5" y="476" text-anchor="middle">area / mass ratio</text>

  <rect class="score" x="845" y="508" width="175" height="52" />
  <text class="label" x="932.5" y="529" text-anchor="middle">Optional Structure</text>
  <text class="small" x="932.5" y="549" text-anchor="middle">WMHD / WBBS</text>

  <path class="arrow-muted" d="M768 306 C805 306 805 169 845 169" />
  <path class="arrow-muted" d="M768 306 C805 306 805 242 845 242" />
  <path class="arrow-muted" d="M768 306 L845 315" />
  <path class="arrow-muted" d="M768 306 C805 306 805 388 845 388" />
  <path class="arrow-muted" d="M768 306 C805 306 805 461 845 461" />
  <path class="dash" d="M768 306 C805 306 805 534 845 534" />

  <!-- Fusion and ranking -->
  <rect class="fusion" x="1080" y="230" width="90" height="138" />
  <text class="label" x="1125" y="258" text-anchor="middle">Score</text>
  <text class="label" x="1125" y="280" text-anchor="middle">Fusion</text>
  <text class="formula" x="1125" y="312" text-anchor="middle">S(R,C_i)</text>
  <text class="small" x="1125" y="337" text-anchor="middle">weighted</text>
  <text class="small" x="1125" y="354" text-anchor="middle">weights</text>

  <rect class="result" x="1080" y="450" width="90" height="88" />
  <text class="label" x="1125" y="482" text-anchor="middle">Top-K</text>
  <text class="label" x="1125" y="504" text-anchor="middle">Cs</text>
  <text class="small" x="1125" y="526" text-anchor="middle">retrieval</text>

  <path class="arrow" d="M1020 169 C1060 169 1050 260 1080 268" />
  <path class="arrow" d="M1020 242 C1055 242 1050 288 1080 292" />
  <path class="arrow" d="M1020 315 L1080 315" />
  <path class="arrow" d="M1020 388 C1055 388 1050 342 1080 342" />
  <path class="arrow" d="M1020 461 C1060 461 1050 360 1080 350" />
  <path class="dash" d="M1020 534 C1065 534 1050 370 1080 360" />
  <path class="arrow" d="M1125 368 L1125 450" />

  <!-- Output notes -->
  <rect class="box" x="295" y="635" width="535" height="56" />
  <text class="label" x="562.5" y="658" text-anchor="middle">Explainable Output for Expert Review</text>
  <text class="small" x="562.5" y="678" text-anchor="middle">query R, mapped C grid, overlay visualization, score decomposition, runtime</text>

  <path class="dash" d="M1125 538 C1020 640 975 662 830 663" />

  <!-- Equation -->
  <text class="formula" x="660" y="724" text-anchor="middle">Score = w_cov Coverage - w_leak Leakage + w_shape Shape + w_loc Location + w_size Size + optional structural score</text>
</svg>
